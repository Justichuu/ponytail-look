<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seen lamp</title>
<style>
  :root { --ink:#120c14; --paper:#f7f1ea; --on:#1f8a62; --off:#c44; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 18px/1.5 Georgia, serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 24px 18px 80px; }
  h1 { font-style: italic; font-weight: 400; }
  .pad { height: 140vh; }
  .end { border-top: 2px solid var(--ink); padding-top: 1rem; }
  .seen-lamp {
    position: fixed; right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    width: min(16rem, calc(100vw - 24px));
    background: #fff; border: 1.6px solid var(--ink); border-radius: 12px;
    padding: 10px 12px 12px; box-shadow: 4px 4px 0 rgba(18,12,20,.12);
  }
  .seen-lamp[data-on="true"] { border-color: var(--on); }
  .seen-lamp-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; border: 0; background: transparent; color: inherit;
    font: inherit; text-align: left; padding: 4px 0; cursor: pointer;
  }
  .seen-lamp-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--off); box-shadow: inset 0 0 0 1px var(--ink);
  }
  .seen-lamp[data-on="true"] .seen-lamp-dot { background: var(--on); }
  .seen-lamp-why { margin: 6px 0 8px; font-size: 14px; }
  .seen-lamp-delay { font-size: 13px; display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main>
  <h1>Seen lamp</h1>
  <p>The light is a witness. It stays off until the bottom of this page, then a tap. Each wait is a delay you can turn off.</p>
  <p>On a phone, a twitch at the top is not the end. Keep going.</p>
  <div class="pad" aria-hidden="true"></div>
  <p class="end" id="end">This is the bottom. Tap the lamp.</p>
</main>
<script src="./seen-lamp.js"></script>
</body>
</html>
